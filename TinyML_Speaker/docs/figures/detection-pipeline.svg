<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" font-family="Helvetica, Arial, sans-serif"><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker></defs><rect width="1200" height="610" fill="#ffffff"/><rect x="10" y="10" width="1180" height="215" rx="10" fill="#eef3f8" stroke="#cbd2d9"/>
<text x="26" y="32" font-size="12" font-weight="bold" fill="#52606d" text-anchor="start">ON EACH BADGE  (Arduino Nano 33 BLE Sense Rev2, causal, no future samples)</text>
<rect x="28" y="44" width="212" height="120" rx="6" fill="#ffffff" stroke="#7b8794" stroke-width="1.2"/>
<text x="40" y="67" font-size="13" font-weight="bold" fill="#1f4e79" text-anchor="start">1  Sensing</text>
<text x="40" y="89" font-size="11.5" font-weight="normal" fill="#1f2933" text-anchor="start">PDM microphone, IMU at 200 Hz</text>
<text x="40" y="107" font-size="11.5" font-weight="normal" fill="#1f2933" text-anchor="start">Sound = mean-square power / 2</text>
<text x="40" y="125" font-size="11.5" font-weight="normal" fill="#1f2933" text-anchor="start">Accel = Σ|Δaxis| in g, 100 ms lag</text>
<text x="40" y="143" font-size="11.5" font-weight="normal" fill="#1f2933" text-anchor="start">Raw audio never leaves the badge</text>
<rect x="261" y="44" width="212" height="120" rx="6" fill="#ffffff" stroke="#7b8794" stroke-width="1.2"/>
<text x="273" y="67" font-size="13" font-weight="bold" fill="#1f4e79" text-anchor="start">2  Rolling baseline</text>
<text x="273" y="89" font-size="11.5" font-weight="normal" fill="#1f2933" text-anchor="start">Last 600 readings at 10 Hz (~60 s)</text>
<text x="273" y="107" font-size="11.5" font-weight="normal" fill="#1f2933" text-anchor="start">Sound quartiles Q<tspan dy="3" font-size="9">25</tspan><tspan dy="-3">, Q</tspan><tspan dy="3" font-size="9">45</tspan><tspan dy="-3">, Q</tspan><tspan dy="3" font-size="9">75</tspan><tspan dy="-3"></tspan></text>
<text x="273" y="125" font-size="11.5" font-weight="normal" fill="#1f2933" text-anchor="start">Accel quartiles Q<tspan dy="3" font-size="9">25</tspan><tspan dy="-3">, Q</tspan><tspan dy="3" font-size="9">75</tspan><tspan dy="-3"></tspan></text>
<text x="273" y="143" font-size="11.5" font-weight="normal" fill="#1f2933" text-anchor="start">Starts after 10 readings</text>
<rect x="494" y="44" width="212" height="120" rx="6" fill="#ffffff" stroke="#7b8794" stroke-width="1.2"/>
<text x="506" y="67" font-size="13" font-weight="bold" fill="#1f4e79" text-anchor="start">3  Normalize and score</text>
<text x="506" y="89" font-size="11.5" font-weight="normal" fill="#1f2933" text-anchor="start">n<tspan dy="3" font-size="9">s</tspan><tspan dy="-3"> = (sound − Q</tspan><tspan dy="3" font-size="9">25</tspan><tspan dy="-3">) / max(IQR</tspan><tspan dy="3" font-size="9">s</tspan><tspan dy="-3">, 1)</tspan></text>
<text x="506" y="107" font-size="11.5" font-weight="normal" fill="#1f2933" text-anchor="start">n<tspan dy="3" font-size="9">a</tspan><tspan dy="-3"> = (accel − Q</tspan><tspan dy="3" font-size="9">25</tspan><tspan dy="-3">) / max(IQR</tspan><tspan dy="3" font-size="9">a</tspan><tspan dy="-3">, 1)</tspan></text>
<text x="506" y="125" font-size="11.5" font-weight="normal" fill="#1f2933" text-anchor="start">s = n<tspan dy="3" font-size="9">s</tspan><tspan dy="-3"> + 1.2 · clip(n</tspan><tspan dy="3" font-size="9">a</tspan><tspan dy="-3">, 0, 2.5)</tspan></text>
<text x="506" y="143" font-size="11.5" font-weight="normal" fill="#1f2933" text-anchor="start">m = (1 s mean − Q<tspan dy="3" font-size="9">45</tspan><tspan dy="-3">) / max(IQR</tspan><tspan dy="3" font-size="9">s</tspan><tspan dy="-3">, 1)</tspan></text>
<rect x="727" y="44" width="212" height="120" rx="6" fill="#ffffff" stroke="#7b8794" stroke-width="1.2"/>
<text x="739" y="67" font-size="13" font-weight="bold" fill="#1f4e79" text-anchor="start">4  Local candidate</text>
<text x="739" y="89" font-size="11.5" font-weight="normal" fill="#1f2933" text-anchor="start">s ≥ 0.75  and  (m &gt; 0  or  s ≥ 3.5)</text>
<text x="739" y="107" font-size="11.5" font-weight="normal" fill="#1f2933" text-anchor="start">Optional tree: confidence ≥ 0.6</text>
<text x="739" y="125" font-size="11.5" font-weight="normal" fill="#1f2933" text-anchor="start">replaces this flag when flashed</text>
<text x="739" y="143" font-size="11.5" font-weight="normal" fill="#1f2933" text-anchor="start">Badge LED follows the candidate</text>
<rect x="960" y="44" width="212" height="120" rx="6" fill="#ffffff" stroke="#7b8794" stroke-width="1.2"/>
<text x="972" y="67" font-size="13" font-weight="bold" fill="#1f4e79" text-anchor="start">5  Stream to PC</text>
<text x="972" y="89" font-size="11.5" font-weight="normal" fill="#1f2933" text-anchor="start">1,536-record send queue</text>
<text x="972" y="107" font-size="11.5" font-weight="normal" fill="#1f2933" text-anchor="start">BLE bulk packet every 5 s</text>
<text x="972" y="125" font-size="11.5" font-weight="normal" fill="#1f2933" text-anchor="start">Score, candidate, sensor scalars</text>
<text x="972" y="143" font-size="11.5" font-weight="normal" fill="#1f2933" text-anchor="start">Queue overflow drops are counted</text>
<path d="M240,104.0 L259,104.0" fill="none" stroke="#1f2933" stroke-width="1.4" marker-end="url(#head)"/>
<path d="M473,104.0 L492,104.0" fill="none" stroke="#1f2933" stroke-width="1.4" marker-end="url(#head)"/>
<path d="M706,104.0 L725,104.0" fill="none" stroke="#1f2933" stroke-width="1.4" marker-end="url(#head)"/>
<path d="M939,104.0 L958,104.0" fill="none" stroke="#1f2933" stroke-width="1.4" marker-end="url(#head)"/>
<text x="600" y="196" font-size="11.5" font-weight="normal" fill="#52606d" text-anchor="middle">Paper rule: no training required. Every acquired sample is scored against the cached baseline.</text>
<path d="M1066.0,164 L1066.0,245 L157,245 L157,303" fill="none" stroke="#1f2933" stroke-width="1.4" marker-end="url(#head)"/>
<rect x="525.0" y="237" width="190" height="17" fill="#ffffff"/>
<text x="620" y="249" font-size="11" font-weight="normal" fill="#52606d" text-anchor="middle">BLE, all badges in parallel</text>
<rect x="10" y="262" width="1180" height="338" rx="10" fill="#f6f4ef" stroke="#cbd2d9"/>
<text x="26" y="284" font-size="12" font-weight="bold" fill="#52606d" text-anchor="start">ON THE PC  (receiver, cross-badge decision, ground truth, evaluation)</text>
<rect x="25" y="305" width="265" height="115" rx="6" fill="#ffffff" stroke="#7b8794" stroke-width="1.2"/>
<text x="37" y="328" font-size="13" font-weight="bold" fill="#1f4e79" text-anchor="start">6  Receiver</text>
<text x="37" y="350" font-size="11.5" font-weight="normal" fill="#1f2933" text-anchor="start">Connects every badge, retries drops</text>
<text x="37" y="368" font-size="11.5" font-weight="normal" fill="#1f2933" text-anchor="start">Maps device ms to UTC with a</text>
<text x="37" y="386" font-size="11.5" font-weight="normal" fill="#1f2933" text-anchor="start">per-connection clock anchor</text>
<text x="37" y="404" font-size="11.5" font-weight="normal" fill="#1f2933" text-anchor="start">Writes raw per-sample CSV</text>
<rect x="320" y="305" width="265" height="115" rx="6" fill="#ffffff" stroke="#7b8794" stroke-width="1.2"/>
<text x="332" y="328" font-size="13" font-weight="bold" fill="#1f4e79" text-anchor="start">7  Cross-badge selection</text>
<text x="332" y="350" font-size="11.5" font-weight="normal" fill="#1f2933" text-anchor="start">500 ms acquisition-time bins</text>
<text x="332" y="368" font-size="11.5" font-weight="normal" fill="#1f2933" text-anchor="start">Bin winner: the eligible badge</text>
<text x="332" y="386" font-size="11.5" font-weight="normal" fill="#1f2933" text-anchor="start">(candidate = 1) with the highest s</text>
<text x="332" y="404" font-size="11.5" font-weight="normal" fill="#1f2933" text-anchor="start">No eligible badge: no winner</text>
<rect x="615" y="305" width="265" height="115" rx="6" fill="#ffffff" stroke="#7b8794" stroke-width="1.2"/>
<text x="627" y="328" font-size="13" font-weight="bold" fill="#1f4e79" text-anchor="start">8  Temporal vote</text>
<text x="627" y="350" font-size="11.5" font-weight="normal" fill="#1f2933" text-anchor="start">Centered window of 5 bins</text>
<text x="627" y="368" font-size="11.5" font-weight="normal" fill="#1f2933" text-anchor="start">Speaker = winner of ≥ 3 of 5 bins</text>
<text x="627" y="386" font-size="11.5" font-weight="normal" fill="#1f2933" text-anchor="start">Otherwise no speaker for the bin</text>
<text x="627" y="404" font-size="11.5" font-weight="normal" fill="#1f2933" text-anchor="start">Only the PC compares badges</text>
<rect x="910" y="305" width="265" height="115" rx="6" fill="#ffffff" stroke="#7b8794" stroke-width="1.2"/>
<text x="922" y="328" font-size="13" font-weight="bold" fill="#1f4e79" text-anchor="start">9  Output</text>
<text x="922" y="350" font-size="11.5" font-weight="normal" fill="#1f2933" text-anchor="start">Labeled CSV per sample</text>
<text x="922" y="368" font-size="11.5" font-weight="normal" fill="#1f2933" text-anchor="start">Speaker label per 500 ms bin</text>
<text x="922" y="386" font-size="11.5" font-weight="normal" fill="#1f2933" text-anchor="start">Input to downstream feature</text>
<text x="922" y="404" font-size="11.5" font-weight="normal" fill="#1f2933" text-anchor="start">extraction and engagement models</text>
<path d="M290,362.5 L318,362.5" fill="none" stroke="#1f2933" stroke-width="1.4" marker-end="url(#head)"/>
<path d="M585,362.5 L613,362.5" fill="none" stroke="#1f2933" stroke-width="1.4" marker-end="url(#head)"/>
<path d="M880,362.5 L908,362.5" fill="none" stroke="#1f2933" stroke-width="1.4" marker-end="url(#head)"/>
<rect x="25" y="465" width="265" height="115" rx="6" fill="#fffdf7" stroke="#7b8794" stroke-width="1.2"/>
<text x="37" y="488" font-size="13" font-weight="bold" fill="#1f4e79" text-anchor="start">A  Observer reference</text>
<text x="37" y="510" font-size="11.5" font-weight="normal" fill="#1f2933" text-anchor="start">Independent observer panel</text>
<text x="37" y="528" font-size="11.5" font-weight="normal" fill="#1f2933" text-anchor="start">Per badge: Speaking / Quiet / Unknown</text>
<text x="37" y="546" font-size="11.5" font-weight="normal" fill="#1f2933" text-anchor="start">Detections hidden while recording</text>
<text x="37" y="564" font-size="11.5" font-weight="normal" fill="#1f2933" text-anchor="start">Intervals saved every 0.2 s</text>
<rect x="320" y="465" width="265" height="115" rx="6" fill="#fffdf7" stroke="#7b8794" stroke-width="1.2"/>
<text x="332" y="488" font-size="13" font-weight="bold" fill="#1f4e79" text-anchor="start">B  Merge</text>
<text x="332" y="510" font-size="11.5" font-weight="normal" fill="#1f2933" text-anchor="start">Match by recording, badge, and</text>
<text x="332" y="528" font-size="11.5" font-weight="normal" fill="#1f2933" text-anchor="start">estimated acquisition time</text>
<text x="332" y="546" font-size="11.5" font-weight="normal" fill="#1f2933" text-anchor="start">Unknown time is excluded</text>
<text x="332" y="564" font-size="11.5" font-weight="normal" fill="#1f2933" text-anchor="start">Optional transition margin</text>
<rect x="615" y="465" width="560" height="115" rx="6" fill="#fffdf7" stroke="#7b8794" stroke-width="1.2"/>
<text x="627" y="488" font-size="13" font-weight="bold" fill="#1f4e79" text-anchor="start">C  Evaluation on held-out whole recordings</text>
<text x="627" y="510" font-size="11.5" font-weight="normal" fill="#1f2933" text-anchor="start">1. Paper rule (steps 1 to 8, no training)</text>
<text x="627" y="528" font-size="11.5" font-weight="normal" fill="#1f2933" text-anchor="start">2. Shallow decision tree on paper features (n<tspan dy="3" font-size="9">s</tspan><tspan dy="-3">, n</tspan><tspan dy="3" font-size="9">a</tspan><tspan dy="-3">, m)</tspan></text>
<text x="627" y="546" font-size="11.5" font-weight="normal" fill="#1f2933" text-anchor="start">3. Shallow decision tree on all 9 features (adds gyro and magnetic magnitude,</text>
<text x="627" y="564" font-size="11.5" font-weight="normal" fill="#1f2933" text-anchor="start">    temperature, humidity, pressure, proximity); exported to C++ for step 4</text>
<path d="M290,522.5 L318,522.5" fill="none" stroke="#1f2933" stroke-width="1.4" marker-end="url(#head)"/>
<path d="M585,522.5 L613,522.5" fill="none" stroke="#1f2933" stroke-width="1.4" marker-end="url(#head)"/>
<path d="M255,420 L255,443 L380,443 L380,463" fill="none" stroke="#1f2933" stroke-width="1.4" marker-end="url(#head)"/>
<rect x="265.0" y="435" width="80" height="17" fill="#ffffff"/>
<text x="305" y="447" font-size="11" font-weight="normal" fill="#52606d" text-anchor="middle">raw samples</text></svg>
